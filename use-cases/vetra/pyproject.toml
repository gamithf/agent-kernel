[project]
name = "vetra"
version = "1.0.0"
description = "Vetra — Veterinary Clinic AI Assistant (multi-agent, WhatsApp-integrated)"
requires-python = ">=3.12"
dependencies = [
    "agentkernel>=0.1.0",
    "openai>=1.0.0",
    "openai-agents>=0.6.5",
    "chromadb>=0.4.0",
    "pydantic>=2.0.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.51.0",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "litellm>=1.0.0",
    "python-pptx>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["*.py", "*.yaml", "*.md"]
