[project]
name = "vetra"
version = "1.0.0"
description = "Vetra — Veterinary Clinic AI Assistant (multi-agent, WhatsApp-integrated)"
requires-python = ">=3.12"
dependencies = [
    "agentkernel>=0.1.0",
    "openai>=1.0.0",
    "agents>=0.1.0",
    "chromadb>=0.4.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
